[package]
name = "tetorica-vsu-synth-tauri"
version = "0.1.1"
edition = "2021"
license = "BSD-3-Clause"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
